[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gha-security-regression"
version = "0.1.0"
description = "Policy-based detection of security regressions in AI-agent-modified GitHub Actions workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=15.0",
  "ruamel.yaml>=0.18",
  "PyYAML>=6.0",
  "requests>=2.31",
  "python-dotenv>=1.0",
  "huggingface_hub>=0.23",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
gha-validate = "policy_validator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
